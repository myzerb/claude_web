<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Token Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="6" height="6" rx="1.5"/><rect x="13" y="5" width="6" height="6" rx="1.5"/><rect x="5" y="13" width="6" height="6" rx="1.5"/><rect x="13" y="13" width="6" height="6" rx="1.5" opacity=".4"/></svg></span>
      Token Chat
    </div>
    <button class="newchat" id="newChat" type="button">+ New chat</button>
    <div class="recents-title">Recent chats</div>
    <nav class="recents" id="recents"></nav>
    <details class="settings">
      <summary>Settings</summary>
      <div class="settings-body">
        <div class="field">
          <label>Provider</label>
          <select id="provider" class="input">
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="openai">OpenAI</option>
            <option value="custom">Custom (OpenAI-compatible)</option>
          </select>
        </div>
        <div class="field" id="baseField" hidden>
          <label>Base URL</label>
          <input id="base" class="input mono" type="url" placeholder="https://api.example.com/v1">
        </div>
        <div class="field">
          <label>API Key</label>
          <div class="keyrow">
            <input id="key" class="input mono" type="password" placeholder="sk-..." autocomplete="off">
            <button class="ghost" id="showKey" type="button">Show</button>
          </div>
          <label class="check"><input type="checkbox" id="remember"> Remember in browser</label>
          <p class="note">Your key goes directly to the provider. Uncheck on shared devices.</p>
        </div>
        <div class="field">
          <label>Model</label>
          <input id="model" class="input mono" autocomplete="off">
        </div>
        <div class="field">
          <label>System Prompt</label>
          <textarea id="system" class="input" placeholder="Optional instructions"></textarea>
        </div>
        <div class="field">
          <label>Max tokens</label>
          <input id="maxTokens" class="input mono" type="number" value="2048">
        </div>
      </div>
    </details>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <div class="top-left">
        <button class="menu-btn" id="menuBtn"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h9"/></svg></button>
        <select id="modelPill" class="pill"></select>
        <span class="chat-title" id="chatTitle">New chat</span>
      </div>
      <div class="meter">
        <span>In <b id="tin">0</b></span>
        <span>Out <b id="tout">0</b></span>
        <span>Tot <b id="ttotal">0</b></span>
      </div>
    </header>

    <div class="scroll" id="scroll">
      <div class="empty" id="empty">
        <span class="logo"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="6" height="6" rx="1.5"/><rect x="13" y="5" width="6" height="6" rx="1.5"/><rect x="5" y="13" width="6" height="6" rx="1.5"/><rect x="13" y="13" width="6" height="6" rx="1.5" opacity=".4"/></svg></span>
        <h2 id="greet">Start a conversation</h2>
        <p>Connect your API key in Settings, pick a model and start talking.</p>
        <div class="cards">
          <button class="chip" data-prompt="Explain what a token is in two sentences"><b>Explain tokens</b><span>Simple explanation</span></button>
          <button class="chip" data-prompt="Write a Python function that parses CSV"><b>Write code</b><span>Python CSV parser</span></button>
          <button class="chip" data-prompt="Give me a 3-day itinerary for Kyoto"><b>Plan a trip</b><span>3 days in Kyoto</span></button>
          <button class="chip" data-prompt="Help me write a polite deadline extension email"><b>Draft an email</b><span>Ask for extension</span></button>
        </div>
      </div>
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <div class="files tray" id="tray"></div>
        <textarea id="input" rows="1" placeholder="How can I help you today?"></textarea>
        <div class="bar">
          <div class="bar-left">
            <button class="tool" id="attach" type="button" title="Attach files">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>
            </button>
            <button class="tool" id="think" type="button" title="Extended thinking">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3a5 5 0 0 0-3 9v2h6v-2a5 5 0 0 0-3-9zM8 17h4"/></svg>
              <span class="lbl">Think</span>
            </button>
            <input id="fileInput" type="file" multiple hidden>
          </div>
          <div class="bar-right">
            <button class="send" id="send" type="submit"></button>
          </div>
        </div>
      </form>
      <p class="disclaimer">AI can make mistakes. Check important info.</p>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/files.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
